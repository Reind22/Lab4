name: Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  publish:
    name: Публикация (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Восстановление зависимостей
        run: dotnet restore PELab4.slnx

      - name: Сборка клиента и сервера
        run: |
          dotnet publish src/TicTacToe.Client -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out/client
          dotnet publish src/TicTacToe.Server -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out/server

      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath PELab4-${{ matrix.rid }}.zip

      - name: Упаковка (Linux и macOS)
        if: runner.os != 'Windows'
        run: cd out && zip -qr ../PELab4-${{ matrix.rid }}.zip .

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: PELab4-${{ matrix.rid }}
          path: PELab4-${{ matrix.rid }}.zip

  release:
    name: Прикрепить к релизу
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
