name: Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  publish:
    name: Публикация (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Восстановление зависимостей
        run: dotnet restore PELab4.slnx

      - name: Тесты
        run: dotnet test PELab4.slnx --no-restore -c Release

      - name: Сборка клиента и сервера
        run: |
          dotnet publish src/TicTacToe.Client -c Release -r ${{ matrix.rid }} --self-contained true -o out/client
          dotnet publish src/TicTacToe.Server -c Release -r ${{ matrix.rid }} --self-contained true -o out/server

      - name: Упаковка (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath PELab4-${{ matrix.rid }}.zip

      - name: Упаковка (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: tar -czf PELab4-${{ matrix.rid }}.tar.gz -C out .

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: PELab4-${{ matrix.rid }}
          path: PELab4-${{ matrix.rid }}.${{ matrix.archive }}

  release:
    name: Прикрепить к релизу
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
